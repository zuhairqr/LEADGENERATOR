{
  "services": {
    "searxng-config-init": {
      "image": "searxng/searxng@sha256:0f48ffe2152f388f5eaede27f96b610449cebfc890d0ad457304475a54ad7b6e",
      "user": "0:0",
      "entrypoint": [
        "sh",
        "-c"
      ],
      "command": [
        "cp /template/settings.yml /config/settings.yml && chown -R searxng:searxng /config"
      ],
      "volumes": [
        "searxng-config:/config",
        "./searxng/settings.yml:/template/settings.yml:ro"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      }
    },
    "searxng": {
      "image": "searxng/searxng@sha256:0f48ffe2152f388f5eaede27f96b610449cebfc890d0ad457304475a54ad7b6e",
      "restart": "unless-stopped",
      "depends_on": {
        "searxng-config-init": {
          "condition": "service_completed_successfully"
        }
      },
      "ports": [
        "127.0.0.1:8082:8080"
      ],
      "environment": {
        "SEARXNG_SECRET": "${SEARXNG_SECRET:?Run initialize-search.cjs}",
        "SEARXNG_BASE_URL": "http://localhost:8082/",
        "SEARXNG_PORT": "8080",
        "SEARXNG_BIND_ADDRESS": "0.0.0.0",
        "GRANIAN_WORKERS": "2"
      },
      "volumes": [
        "searxng-config:/etc/searxng",
        "searxng-data:/var/cache/searxng"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
        ],
        "interval": "10s",
        "timeout": "6s",
        "retries": 12,
        "start_period": "20s"
      },
      "mem_limit": "512m",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      }
    },
    "n8n": {
      "depends_on": {
        "searxng": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "N8N_INSTANCE_AI_SEARXNG_URL": "http://searxng:8080"
      }
    }
  },
  "volumes": {
    "searxng-config": {},
    "searxng-data": {}
  }
}