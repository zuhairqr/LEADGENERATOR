use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - duckduckgo
      - wikipedia
general:
  instance_name: Lead Generator Search
  debug: false
search:
  safe_search: 1
  autocomplete: ""
  default_lang: en
  formats:
    - html
    - json
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
engines:
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
