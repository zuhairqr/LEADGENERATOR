# Dedicated Docker-capable host only. Do not run on an existing web server without
# reviewing port conflicts (80/443), DNS, backups, firewall and current n8n security guidance.
name: lead-generator-automation
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong private database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [database]

  n8n:
    # Set an exact reviewed stable version; never silently track latest.
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Set an exact supported n8n version}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong private database password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set and back up a random encryption key}
      N8N_HOST: ${N8N_HOST:?Set your automation subdomain}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.readWriteFile","n8n-nodes-base.ssh"]'
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      GENERIC_TIMEZONE: UTC
      TZ: UTC
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [database, frontend]
    # No host port: accessible only through the reverse proxy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      N8N_HOST: ${N8N_HOST:?Set your automation subdomain}
      ACME_EMAIL: ${ACME_EMAIL:?Set the TLS certificate contact email}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]

networks:
  database:
    internal: true
  frontend:

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
